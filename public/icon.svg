<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="manimani">
  <!-- Evergreen tile, matching the brand colour used throughout the app. -->
  <rect width="64" height="64" rx="15" fill="#0E3A2F"/>
  <!-- A ledger rule, and a line that clears it. The mark is the idea: the
       month is under control, and today sits above the line. -->
  <path d="M14 45h36" stroke="#5DCAA5" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M17 34.5 27 22l8 8 10-12" stroke="#FFFFFF" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
